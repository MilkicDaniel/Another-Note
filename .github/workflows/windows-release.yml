name: Requested Windows release
run-name: Windows release - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/windows-*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read the application version
        id: meta
        run: python -c 'import os; from release_config import read_version; open(os.environ["GITHUB_OUTPUT"], "a").write("version=" + read_version() + "\n")'
      - name: Install the pinned build tools
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0
          curl --fail --location --retry 3 https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz --output "$RUNNER_TEMP/zig-0.14.1.tar.xz"
          printf '%s  %s\n' 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c "$RUNNER_TEMP/zig-0.14.1.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig-0.14.1.tar.xz" -C "$RUNNER_TEMP"
      - name: Build the Windows installer and portable package
        shell: bash
        run: python windows/build_windows.py --zig "$RUNNER_TEMP/zig-x86_64-linux-0.14.1/zig"
      - name: Check recovery, launch routing, editor startup and windows
        shell: bash
        run: |
          python -m unittest discover -s checks -p 'test_*.py' -q
          node checks/test_app_startup.cjs
          node checks/test_window_features.cjs
          node checks/test_editor_preferences.cjs
          node checks/test_format_preferences.cjs
          node checks/test_table_data.cjs
      - name: Verify and assemble versioned release downloads
        shell: bash
        run: python package_release.py --output dist/releases --include-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Another-Note-Windows-release-${{ steps.meta.outputs.version }}
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Another-Note-Windows-release-${{ needs.build.outputs.version }}
          path: release-downloads
      - name: Prepare the Windows test desktop
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Warning $_ }
          }
      - name: Ensure Microsoft WebView2 is available
        shell: pwsh
        run: |
          $keys = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $installed = $keys | ForEach-Object { Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue } | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' }
          if (-not $installed) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*O=Microsoft Corporation*') { throw 'Invalid Microsoft runtime signature' }
            $result = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            Write-Host "WebView2 installer exit: $($result.ExitCode)"
          }
      - name: Check the package hashes and extract the app
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          Get-Content "release-downloads/Another-Note-SHA256SUMS-$version.txt" | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid checksum entry' }
            if ((Get-FileHash (Join-Path 'release-downloads' $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) { throw 'Release asset checksum mismatch' }
          }
          Expand-Archive "release-downloads/Another-Note-Windows-$version.zip" -DestinationPath (Join-Path $env:RUNNER_TEMP 'native-package')
      - name: Measure native placement and consolidate packaged tabs
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'native-package/another-note-windows'
          & "$app/runtime/python.exe" checks/windows_native_placement.py --app $app
          if ($LASTEXITCODE -ne 0) { throw "Native placement check failed: $LASTEXITCODE" }

  publish:
    needs: [build, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Another-Note-Windows-release-${{ needs.build.outputs.version }}
          path: dist/releases
      - name: Publish the verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python3 -c 'from release_config import read_version; print(read_version())')"
          notes="$RUNNER_TEMP/Another-Note-Release-$version.md"
          cat > "$notes" <<EOF
          Windows installer and portable ZIP for Another Note $version.

          File > Move All Tabs to This Window gathers tabs from the other open windows, preserving drafts, selection, undo and disk bindings. Empty source windows close, while busy or unsuccessful moves retain their tabs. The destination's current tab stays selected.

          Windows captures the physical mouse position in the EXE, selects per-monitor display scaling before window creation, and verifies placement after queued startup events. Dragging or resizing cancels the remaining startup checks. The reported physical second-monitor issue has not been reproduced on the single-display runner.

          Close all Another Note windows before updating. Install with Another-Note-Setup-$version.exe, or extract Another-Note-Windows-$version.zip and run Another-Note.exe inside it.

          The package build verifies dependency hashes, installer payloads and editor versions. Native WinForms delayed-placement, packaged first/repeat launches, and actual editor tab consolidation with draft/selection/undo checks run on Windows before publication. The runner has one display; physical dual-monitor and mixed-DPI hardware were not available.
          EOF
          if gh release view "$version" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true
            gh release upload "$version" dist/releases/* --clobber
          else
            gh release create "$version" dist/releases/* --draft --target "$GITHUB_SHA" --title "Another Note $version" --notes-file "$notes"
          fi
          gh release edit "$version" --draft=false --latest
          gh release view "$version" --json url,assets
