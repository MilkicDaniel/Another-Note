name: Requested Windows release
run-name: Windows release - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/windows-*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned build tools
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0
          curl --fail --location --retry 3 https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz --output "$RUNNER_TEMP/zig-0.14.1.tar.xz"
          printf '%s  %s\n' 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c "$RUNNER_TEMP/zig-0.14.1.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig-0.14.1.tar.xz" -C "$RUNNER_TEMP"
      - name: Build the Windows installer and portable package
        shell: bash
        run: python windows/build_windows.py --zig "$RUNNER_TEMP/zig-x86_64-linux-0.14.1/zig"
      - name: Check recovery, launch routing, editor startup and windows
        shell: bash
        run: |
          python -m unittest discover -s checks -p 'test_*.py' -q
          node checks/test_app_startup.cjs
          node checks/test_window_features.cjs
      - name: Verify and assemble versioned release downloads
        shell: bash
        run: python package_release.py --output dist/releases --include-windows
      - name: Publish the verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python -c 'from release_config import read_version; print(read_version())')"
          notes="$RUNNER_TEMP/Another-Note-Release-$version.md"
          cat > "$notes" <<EOF
          Windows installer and portable ZIP for Another Note $version.

          Launching Another Note again without file arguments opens a new window with one blank tab. Existing windows and drafts stay open. File arguments still open in the existing app.

          Close all Another Note windows before updating. Install with Another-Note-Setup-$version.exe, or extract Another-Note-Windows-$version.zip and run Another-Note.exe inside it.

          The package build verifies all pinned dependency hashes, the installer payload, every packaged file and the editor build. Automated host, startup and multiwindow tests run before publication. Native Windows/WebView2 GUI testing was not performed.
          EOF
          if gh release view "$version" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true
            gh release upload "$version" dist/releases/* --clobber
          else
            gh release create "$version" dist/releases/* --draft --target "$GITHUB_SHA" --title "Another Note $version" --notes-file "$notes"
          fi
          gh release edit "$version" --draft=false --latest
          gh release view "$version" --json url,assets
