name: Editor release
run-name: Editor release - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/editor-*'

permissions:
  contents: read

concurrency:
  group: editor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read the application version
        id: meta
        run: python -c 'import os; from release_config import read_version; open(os.environ["GITHUB_OUTPUT"], "a").write("version=" + read_version() + "\n")'
      - name: Build the offline editor and run regression checks
        shell: bash
        run: |
          python build.py
          python -m unittest discover -s checks -p 'test_*.py' -q
          for check in checks/test_*.cjs; do
            node "$check"
          done
      - name: Prepare the browser test
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/another-note-browser-checks" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/another-note-browser-checks/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check the real preferences and table UI
        shell: bash
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/another-note-browser-checks/node_modules/playwright" QA_SCREENSHOTS="$RUNNER_TEMP/another-note-ui" node checks/editor_preferences_browser.cjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/another-note-browser-checks/node_modules/playwright" QA_SCREENSHOTS="$RUNNER_TEMP/another-note-ui" node checks/editor_tables_browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Another-Note-UI-check-${{ steps.meta.outputs.version }}
          path: ${{ runner.temp }}/another-note-ui/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble versioned HTML, Fedora and source downloads
        shell: bash
        run: python package_release.py --output dist/releases
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Another-Note-Editor-release-${{ steps.meta.outputs.version }}
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Another-Note-Editor-release-${{ needs.build.outputs.version }}
          path: dist/releases
      - name: Verify and publish the release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python3 -c 'from release_config import read_version; print(read_version())')"
          (cd dist/releases && sha256sum --check "Another-Note-SHA256SUMS-$version.txt")
          notes="$RUNNER_TEMP/Another-Note-Release-$version.md"
          cat > "$notes" <<EOF
          HTML, Fedora and source downloads for Another Note $version.

          Tools > Insert/Edit Table opens a cell grid with row/column controls, a header option, alignment, Preview and Source views. Tools > Paste Table accepts web/spreadsheet tables, Markdown, CSV and tab-separated data. Paste a cell rectangle into the grid to fill or expand it.

          Tables are saved as Markdown, HTML, CSV or TSV source. Rich table pastes at blank note lines open the grid for review; Paste Text Instead keeps the original clipboard text. Code pastes and Markdown code fences keep their normal behavior. Merged cells expand to a rectangular grid, with their values retained in the upper-left cell. Insert/update is one undoable edit and keeps surrounding text intact.

          Validation includes regression and real Chromium checks for table creation/editing, clipboard formats, quoted multiline cells, merged cells, source preservation, HTML attributes, inert pasted markup, conflict protection, undo and smaller windows. The r5 syntax/font/formatting editor is included. Native GTK and Windows visual testing was not performed for this build.
          EOF
          if gh release view "$version" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-is-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true
            gh release upload "$version" dist/releases/* --clobber
          else
            gh release create "$version" dist/releases/* --draft --target "$GITHUB_SHA" --title "Another Note $version" --notes-file "$notes"
          fi
          gh release edit "$version" --draft=false --latest
          gh release view "$version" --json url,assets
